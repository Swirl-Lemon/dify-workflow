          \    \"\"\"\n    sections = []\n    \n    # 处理用户输入文本\n    if query and query.strip():\n\
          \        sections.append(\"【用户输入文本】\\n\\n\" + query.strip())\n    \n   \
          \ # 处理图片文本\n    if image_text and image_text.strip():\n        sections.append(\"\
          【图片文本】\\n\\n\" + image_text.strip())\n    \n    # 处理文件文本（数组格式）\n    if file_text\
          \ and isinstance(file_text, list):\n        file_contents = []\n       \
          \ for idx, text in enumerate(file_text, 1):\n            if text and str(text).strip():\n\
          \                file_contents.append(str(text).strip())\n        \n   \
          \     if file_contents:\n            # 如果多个文件，用分隔符分开\n            if len(file_contents)\
          \ > 1:\n                file_text_combined = \"\\n\\n---\\n\\n\".join(\n\
          \                    f\"文件{idx}:\\n{content}\" \n                    for\
          \ idx, content in enumerate(file_contents, 1)\n                )\n     \
          \       else:\n                file_text_combined = file_contents[0]\n \
          \           \n            sections.append(\"【文件文本】\\n\\n\" + file_text_combined)\n\
          \    \n    # 合并所有部分，用空行分隔\n    result = \"\\n\\n\".join(sections) if sections\
          \ else \"\"\n    \n    return {\"result\": result}"
