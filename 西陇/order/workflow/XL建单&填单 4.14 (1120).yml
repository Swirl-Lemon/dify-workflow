            \ intent=\"未识别意图\" 时固定输出指定的澄清问题\n- missing_fields: string[]，可选。缺失的字段名称列表，需澄清时返回\n\
            \n\n\n\n\n\n### 订单数据字段（仅当 intent=\"自助下单\" 时必返）：\n- orderlist: 按照structured_output结构定义的必填字段返回，非必填字段缺失不澄清\n\
            \n\n\n\n\n\n\n## Few-Shot\n### 示例1：自助下单（相对日期，不需澄清）\n**原始订单信息**： \n```\n\
            当前时间：2025-11-12（周三）\n用户原始订单信息：为太禾下单10桶甲苯，单价3000元/桶，本周五交货\n```\n\n\n\n\n\
